name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true

# Read by default. Only the publish job creates anything.
permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon only. terminator links SDL3 and FreeType from
        # Homebrew via pkg-config, so it cannot be cross-compiled -- an
        # x86_64 build needs an actual Intel runner with Intel brew kegs.
        include:
          - os: macos-15
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup
        with:
          zig-version: ${{ env.ZIG_VERSION }}
          libraries: 'true'

      # Deliberately no -Dtarget. The runner is already the target, and
      # naming it explicitly stops Zig using the macOS SDK's headers, so
      # `@cImport` of <util.h> for forkpty fails with "'util.h' not found".
      # A cross-compile is impossible here anyway -- see the matrix comment.
      - name: Build
        run: zig build -Doptimize=ReleaseFast

      # The artifact must report the tag it was built for. V0 moved the
      # version to build.zig.zon so that nothing has to be kept in step by
      # hand; this is the check that says so about the thing users download.
      - name: Check the binary reports the tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          got=$(./zig-out/bin/terminator --version)
          echo "$got"
          case "$got" in
            "terminator ${tag#v}"|"terminator ${tag#v} ("*) ;;
            *) echo "binary reports '$got', expected version ${tag#v}" >&2; exit 1 ;;
          esac

      - name: Package
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          name="terminator-${tag}-${{ matrix.arch }}-macos"
          mkdir -p "dist/${name}"
          cp zig-out/bin/terminator "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          # Record the basename, not the build path: whoever downloads
          # these two files puts them side by side, and a checksum naming
          # `dist/...` makes `shasum -a 256 -c` fail to find its own file.
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminator-${{ matrix.arch }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Two gates. A tag that disagrees with build.zig.zon would ship a
      # v0.2.0 artifact whose binary reports 0.1.0 -- the drift that having
      # one source of truth exists to remove, and nothing but a human
      # currently couples the two. A tag the changelog does not describe
      # does not ship either; the hand-written section is the release body,
      # because notes generated from PR titles are a list of commits rather
      # than a description of what changed. They belong underneath it.
      - name: Compose the release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          zon=$(scripts/zon-version.sh)
          if [ "$zon" != "${tag#v}" ]; then
            echo "tag $tag does not match build.zig.zon .version $zon" >&2
            exit 1
          fi
          scripts/changelog-section.sh "$tag" > body.md
          {
            printf '\n## All changes\n\n'
            gh api --method POST \
              "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$tag" --jq .body
          } >> body.md
          cat body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes-file body.md \
            --verify-tag \
            dist/*
