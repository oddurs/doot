name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true

permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon only. terminator links SDL3 and FreeType from
        # Homebrew via pkg-config, so it cannot be cross-compiled -- an
        # x86_64 build needs an actual Intel runner with Intel brew kegs.
        include:
          - os: macos-15
            arch: aarch64
            target: aarch64-macos
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install SDL3 and FreeType
        run: |
          brew update --quiet
          brew install sdl3 freetype pkg-config

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          name="terminator-${tag}-${{ matrix.arch }}-macos"
          mkdir -p "dist/${name}"
          cp zig-out/bin/terminator "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          shasum -a 256 "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: terminator-${{ matrix.arch }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Two gates. A tag that disagrees with build.zig.zon would ship a
      # v0.2.0 artifact whose binary reports 0.1.0 -- the drift that having
      # one source of truth exists to remove, and nothing but a human
      # currently couples the two. A tag the changelog does not describe
      # does not ship either; the hand-written section is the release body,
      # because notes generated from PR titles are a list of commits rather
      # than a description of what changed. They belong underneath it.
      - name: Compose the release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          zon=$(scripts/zon-version.sh)
          if [ "$zon" != "${tag#v}" ]; then
            echo "tag $tag does not match build.zig.zon .version $zon" >&2
            exit 1
          fi
          scripts/changelog-section.sh "$tag" > body.md
          {
            printf '\n## All changes\n\n'
            gh api --method POST \
              "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$tag" --jq .body
          } >> body.md
          cat body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes-file body.md \
            --verify-tag \
            dist/*
