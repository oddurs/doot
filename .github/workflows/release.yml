name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true

permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon only. terminator links SDL3 and FreeType from
        # Homebrew via pkg-config, so it cannot be cross-compiled -- an
        # x86_64 build needs an actual Intel runner with Intel brew kegs.
        include:
          - os: macos-15
            arch: aarch64
            target: aarch64-macos
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install SDL3 and FreeType
        run: |
          brew update --quiet
          brew install sdl3 freetype pkg-config

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          name="terminator-${tag}-${{ matrix.arch }}-macos"
          mkdir -p "dist/${name}"
          cp zig-out/bin/terminator "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          shasum -a 256 "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: terminator-${{ matrix.arch }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --generate-notes \
            --verify-tag \
            dist/*
