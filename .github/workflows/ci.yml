name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch supersedes the run already in flight for it.
# main is exempt: every commit there should have its own recorded result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  format:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Check formatting
        run: zig fmt --check build.zig src/

  test:
    name: ${{ matrix.optimize }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS only: the renderer is Metal-backed and the PTY tests fork a
        # real shell. Both are the point of the project, not incidental.
        os: [macos-15, macos-14]
        optimize: [Debug, ReleaseFast]
    steps:
      - uses: actions/checkout@v5

      - name: Install SDL3 and FreeType
        run: |
          brew update --quiet
          brew install sdl3 freetype pkg-config

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }} --summary all

      - name: Test
        # The e2e suite drives a real shell on a real PTY. It never opens a
        # window, so it runs headless on a CI runner unchanged.
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all

  bench:
    name: bench
    runs-on: ubuntu-latest
    # Never gates a merge. A shared CI runner is far too noisy to decide
    # whether a change is a regression -- the job exists so the numbers show
    # up next to the diff, and so an order-of-magnitude mistake is visible
    # without anyone having to run it locally. bench/baseline.txt, captured
    # on a quiet machine, remains the number to beat.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run benchmarks
        # No SDL and no window: vt, grid and terminal import nothing but std.
        run: |
          {
            echo "### Benchmarks"
            echo
            echo "Shared runner, so these are indicative only -- not a baseline."
            echo
            echo '```'
            zig build bench
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
