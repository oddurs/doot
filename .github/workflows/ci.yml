name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch supersedes the run already in flight for it.
# main is exempt: every commit there should have its own recorded result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  format:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Check formatting
        run: zig fmt --check build.zig src/

      # The release gates are shell, so `zig build test` cannot see them.
      # They decide what ships, so they get their own tests and their own
      # CI step rather than being trusted because they worked once.
      - name: Test the release scripts
        run: ./scripts/test-changelog-section.sh

      # Gating, unlike the bench and the gallery. A corpus is a recording
      # of a real program, and a real program prints whatever it prints --
      # the first pair of these reached a public repository carrying live
      # session links. This is the half that does not rely on anyone
      # remembering to look.
      - name: Check the corpora carry no secrets
        run: zig build check-corpora

  test:
    name: ${{ matrix.optimize }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS only: the renderer is Metal-backed and the PTY tests fork a
        # real shell. Both are the point of the project, not incidental.
        os: [macos-15, macos-14]
        optimize: [Debug, ReleaseFast]
    steps:
      - uses: actions/checkout@v7

      - name: Install SDL3 and FreeType
        run: |
          brew update --quiet
          brew install sdl3 freetype pkg-config

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }} --summary all

      - name: Test
        # The e2e suite drives a real shell on a real PTY. It never opens a
        # window, so it runs headless on a CI runner unchanged.
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all

  bench:
    name: bench
    runs-on: ubuntu-latest
    # Never gates a merge. A shared CI runner is far too noisy to decide
    # whether a change is a regression -- the job exists so the numbers show
    # up next to the diff, and so an order-of-magnitude mistake is visible
    # without anyone having to run it locally. bench/baseline.txt, captured
    # on a quiet machine, remains the number to beat.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run benchmarks
        # No SDL and no window: vt, grid and terminal import nothing but std.
        #
        # Written to the log as well as the job summary. The summary is what
        # a reviewer reads in the browser; the log is what `gh run view --log`
        # can grep, which is the only way to get at these from a terminal.
        run: |
          zig build bench | tee bench-result.txt
          {
            echo "### Benchmarks"
            echo
            echo "Shared runner, so these are indicative only -- not a baseline."
            echo "\`bench/baseline.txt\`, captured on a quiet machine, is the number to beat."
            echo
            echo '```'
            cat bench-result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  gallery:
    name: gallery
    runs-on: macos-15
    # Never gates a merge, for the same reason the bench does not: a visual
    # diff is usually an intended change, and the reviewer is the one who
    # decides. The job exists so the numbers and the renders sit next to
    # the diff instead of living on one person's machine.
    #
    # The committed references are rendered on a maintainer's Mac. A runner
    # whose system font differs by a version will show a whole-image delta
    # here that is not a regression -- read the uploaded renders, not just
    # the percentages.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install SDL3 and FreeType
        run: |
          brew update --quiet
          brew install sdl3 freetype pkg-config

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Render the gallery
        # Headless: the build step sets SDL_VIDEODRIVER=dummy, so this
        # needs no display. See src/gallery.zig.
        run: |
          zig build gallery 2>&1 | tee gallery.txt
          {
            echo "### Gallery"
            echo
            echo "Rendered headless on this runner and diffed against the committed"
            echo "references. Indicative only -- a different system font version reads"
            echo "as a whole-image delta. The renders are attached as an artifact."
            echo
            echo '```'
            cat gallery.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: gallery-renders
          path: bench/gallery/current/*.png
          if-no-files-found: error
